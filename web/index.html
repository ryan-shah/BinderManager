<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="binder_manager">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>binder_manager</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Register the COOP/COEP service worker so OPFS + SharedArrayBuffer are
    // available (drift's preferred web storage). One reload is required the
    // first time so the page loads under the injected headers; a
    // sessionStorage flag prevents reload loops if isolation still fails.
    //
    // The app bootstrap is deferred until the isolation decision is final —
    // if the app booted before the reload, drift would create its database
    // in the IndexedDB fallback and keep using it forever (drift prefers an
    // existing database over a better storage implementation).
    (function () {
      function loadApp() {
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js';
        s.async = true;
        document.body.appendChild(s);
      }

      var needsReload =
        'serviceWorker' in navigator &&
        !window.crossOriginIsolated &&
        !sessionStorage.getItem('coiReloaded');

      if (!needsReload) {
        loadApp();
        return;
      }

      var timeout = new Promise(function (resolve) {
        setTimeout(resolve, 4000);
      });
      var ready = navigator.serviceWorker
        .register('coi_serviceworker.js')
        .then(function () { return navigator.serviceWorker.ready; })
        .then(function () { return 'ready'; });

      Promise.race([ready, timeout])
        .then(function (result) {
          if (result === 'ready') {
            // The SW claims existing clients, but headers only apply to
            // responses served through it — reload once to pick them up.
            sessionStorage.setItem('coiReloaded', '1');
            window.location.reload();
          } else {
            console.warn('COI service worker not ready in time; ' +
                'continuing without cross-origin isolation.');
            loadApp();
          }
        })
        .catch(function (e) {
          console.warn('COI service worker failed:', e);
          loadApp();
        });
    })();
  </script>
</body>
</html>
